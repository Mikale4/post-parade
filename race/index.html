<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post Parade</title>
<!-- The interface's three faces (see theme.css). Offline they fall back to system fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script>
  /* theme.css owns the palette and the race/front-of-house look; theme-meta.css styles
     the scout, stable, quests and career screens in the same language. Both are
     cache-busted, because a stale stylesheet during iteration looks like a broken layout. */
  var cssV = Date.now();
  document.write('<link rel="stylesheet" href="theme.css?v='+cssV+'">');
  document.write('<link rel="stylesheet" href="theme-meta.css?v='+cssV+'">');
</script>
<style>
  /* The race HUD and its sheet (deck, exhibition setup, results), in the race-day
     language of theme.css. Everything here is scoped to #scr-game and #modal: the first
     version set bare `button`, `table` and `.coach` rules page-wide, which turned every
     hovered tile on every other screen navy and restyled the tutorial coach. */
  #scr-game,#modal{
    --panel:var(--paper); --panel2:var(--paper-2); --dim:var(--ink-3);
    --good:var(--turf); --warn:#d9822a; --bad:var(--red); --accent:var(--sky);
  }
  *{box-sizing:border-box}
  #scr-game .wrap{color:var(--ink);font:500 14px/1.45 var(--font-ui);display:flex;flex-direction:column;height:100vh;max-width:1600px;margin:0 auto}
  /* A bare button here is a small paper key. :where() keeps this at zero specificity, so
     .btn, .pick and the HUD's own buttons restyle it without fighting it. */
  :where(#scr-game,#modal) button:where(:not(.btn)){font:inherit;color:var(--ink);background:var(--paper-2);border:0;
    border-radius:var(--r-sm);padding:6px 11px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--rule-2),0 2px 0 var(--rule-2)}
  :where(#scr-game,#modal) button:where(:not(.btn):hover:not(:disabled)){background:#fff}
  :where(#scr-game,#modal) button:where(:not(.btn):active:not(:disabled)){transform:translateY(2px);box-shadow:inset 0 0 0 1px var(--rule-2)}
  :where(#scr-game,#modal) button:where(:disabled){opacity:.45;cursor:default}
  :is(#scr-game,#modal) .spacer{flex:1}
  :is(#scr-game,#modal) .meta{color:var(--ink-3);font-size:13px}
  :is(#scr-game,#modal) .meta b{color:var(--ink);font-weight:800}

  /* ---- the top bar: the tote board ---- */
  #scr-game .top{display:flex;align-items:center;gap:12px;padding:8px 14px;flex:none;
       background:var(--board);border-bottom:3px solid var(--gold);z-index:5;color:#e8efe6}
  #scr-game .top h1{font:400 15px/1 var(--font-display);margin:0;color:#fff;letter-spacing:.02em}
  #scr-game .top .meta{color:#a8b8ac}
  #scr-game .top .meta b{color:#fff}
  #scr-game .gradetag{background:var(--gold);color:#3a2800;border-radius:var(--r-sm);padding:1px 7px;font:800 italic 14px var(--font-num)}
  #scr-game .phase{padding:5px 11px 4px;border-radius:var(--r-sm);font:800 12px/1 var(--font-ui);color:var(--led);
         background:#0c140f;box-shadow:inset 0 0 0 1px #3a4a3e;letter-spacing:.04em}
  #scr-game .phase.final{background:var(--gold);color:#3a2800;box-shadow:none}
  #scr-game #clock{font:800 italic 22px/1 var(--font-num);color:var(--led);min-width:68px;text-align:right;
         text-shadow:0 0 8px rgba(255,178,30,.35)}
  #scr-game .rate{display:inline-flex;gap:3px;padding:3px;background:#0c140f;border-radius:var(--r);box-shadow:inset 0 0 0 1px #3a4a3e}
  #scr-game .rate button{background:transparent;color:#a8b8ac;box-shadow:none;padding:5px 10px;
    font:800 italic 15px/1 var(--font-num)}
  #scr-game .rate button:hover:not(:disabled){background:#223127;color:#fff}
  #scr-game .rate button.sel{background:var(--turf);color:#fff;box-shadow:0 2px 0 var(--turf-deep)}
  #scr-game .top > button{background:#223127;color:#e8efe6;box-shadow:inset 0 0 0 1px #3a4a3e,0 2px 0 #0c140f;font-weight:800}
  #scr-game .top > button:hover:not(:disabled){background:#2c4033}

  /* ---- start to finish ---- */
  #scr-game .strip{position:relative;height:30px;flex:none;background:#14281a;border-bottom:1px solid #0c140f}
  #scr-game .strip .track{position:absolute;left:58px;right:62px;top:14px;height:2px;background:rgba(255,255,255,.35)}
  #scr-game .strip::before,#scr-game .strip::after{position:absolute;top:8px;font:800 italic 13px/1 var(--font-num);color:#fff;letter-spacing:.04em}
  #scr-game .strip::before{content:"START";left:8px;color:#8fd06a}
  #scr-game .strip::after{content:"FINISH";right:10px;color:var(--led)}
  #scr-game .pip{position:absolute;top:8px;width:8px;height:14px;border-radius:2px;transform:translateX(-50%);
       transition:left .05s linear;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
  #scr-game .pip.me{width:12px;height:20px;top:5px;box-shadow:0 0 0 2px var(--gold),0 0 0 3px #000;z-index:5}

  #scr-game .stage{position:relative;flex:1;min-height:0;background:#0e1016}
  #scr-game canvas{display:block;width:100%;height:100%}
  #scr-game .stage canvas{position:absolute;inset:0}
  #cv{pointer-events:none}
  #btnCam{min-width:118px}
  #btnCam[hidden]{display:none}
  /* the real game's placing: big, gold, italic, over the race */
  #rankBig{position:absolute;left:18px;top:12px;z-index:4;pointer-events:none;display:flex;align-items:baseline;gap:2px;
    font:800 italic 64px/1 var(--font-num);color:var(--gold);-webkit-text-stroke:5px #3a2400;paint-order:stroke fill;
    text-shadow:0 4px 0 #3a2400,0 8px 18px rgba(0,0,0,.4)}
  #rankBig small{font-size:28px;color:#fff;-webkit-text-stroke:4px #1e2a22}
  #rankBig[hidden]{display:none}
  #togo{position:absolute;right:16px;top:14px;z-index:4;pointer-events:none;
    font:800 italic 26px/1 var(--font-num);color:#fff;-webkit-text-stroke:4px #1e2a22;paint-order:stroke fill}
  #togo small{font-size:15px}
  /* the race caller's line (caller.js): a broadcast caption under the action, names in gold */
  #scr-game #callerCap{position:absolute;left:50%;bottom:18px;transform:translate(-50%,6px);z-index:4;pointer-events:none;
    width:max-content;max-width:min(80%,620px);padding:7px 16px 8px;background:rgba(10,18,12,.8);border-left:4px solid var(--gold);
    font:700 17px/1.3 var(--font-ui);color:#fff;text-align:center;opacity:0;transition:opacity .2s,transform .2s}
  #scr-game #callerCap.on{opacity:1;transform:translate(-50%,0)}
  #scr-game #callerCap b{color:var(--gold);font-weight:800}
  #scr-game .stage:has(.firsttip) #callerCap{bottom:auto;top:60px}
  @media (max-width:600px){ #scr-game #callerCap{font-size:14px;max-width:92%;bottom:10px;padding:6px 12px 7px} }
  #scr-game .introskip{position:absolute;right:16px;bottom:14px;padding:6px 12px;border-radius:var(--r-sm);
             font:800 12px var(--font-ui);color:#fff;background:rgba(14,30,18,.75);pointer-events:none;
             animation:introskip 1.6s ease-in-out infinite alternate}
  @keyframes introskip{from{opacity:.55}to{opacity:1}}
  #scr-game .banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #scr-game .banner .big{font:800 italic 96px/1 var(--font-num);-webkit-text-stroke:7px #3a2400;paint-order:stroke fill;
    text-shadow:0 6px 0 #3a2400,0 12px 30px rgba(0,0,0,.6)}

  /* unique-skill cutscene: the racer's own moment, so it takes the whole stage
     briefly without ever pausing the simulation underneath */
  #scr-game .cut{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none}
  #scr-game .cut.on{display:block}
  #scr-game .cut .sweep{position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 28%,rgba(242,183,5,.18) 46%,
      rgba(255,255,255,.28) 50%,rgba(242,183,5,.18) 54%,transparent 72%);
    transform:translateX(-100%);animation:sweep 1.5s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes sweep{to{transform:translateX(100%)}}
  /* the 3D cutscene's title: the skill's name lands over the hero shot */
  #scr-game .cut.vox .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:cutflash var(--len) linear forwards}
  @keyframes cutflash{0%{opacity:.85}7%{opacity:0}95%{opacity:0}100%{opacity:.6}}
  #scr-game .cut.vox .splash{position:absolute;left:0;bottom:12%;opacity:0;padding:12px 90px 14px 6%;
    background:linear-gradient(90deg,rgba(10,18,12,.82) 55%,rgba(10,18,12,0));
    animation:cutsplash calc(var(--len) - var(--hero)) cubic-bezier(.2,.8,.2,1) var(--hero) forwards}
  #scr-game .cut.vox .splash .nm{font:400 46px/1.05 var(--font-display);color:var(--gold);
    -webkit-text-stroke:6px #2a1a00;paint-order:stroke fill;text-shadow:0 5px 0 #2a1a00}
  #scr-game .cut.vox .splash .wh{font:800 15px var(--font-ui);color:#fff;margin-top:8px;letter-spacing:.04em}
  #scr-game .cut.vox.short .splash .nm{font-size:32px}
  @keyframes cutsplash{0%{opacity:0;transform:translateX(-70px) skewX(-10deg)}
    20%{opacity:1;transform:translateX(0) skewX(-10deg)}85%{opacity:1;transform:translateX(8px) skewX(-10deg)}
    100%{opacity:0;transform:translateX(24px) skewX(-10deg)}}
  /* a rivalry (runRival3D): each piece shows at its beat (--at) for its time (--dur) */
  #scr-game .cut.rival > div{position:absolute;opacity:0;animation:rvshow var(--dur) ease-out var(--at) forwards}
  @keyframes rvshow{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
  #scr-game .cut.rival .rv-title{left:0;right:0;top:8%;display:flex;justify-content:center;align-items:center;gap:22px}
  #scr-game .cut.rival .rv-title span{font:400 30px/1 var(--font-display);color:#fff;-webkit-text-stroke:5px #10140e;paint-order:stroke fill}
  #scr-game .cut.rival .rv-title i{font:400 54px/1 var(--font-display);font-style:italic;color:var(--gold);
    -webkit-text-stroke:6px #2a1a00;paint-order:stroke fill;text-shadow:0 5px 0 #2a1a00}
  #scr-game .cut.rival .rv-say{bottom:13%;max-width:44%;padding:10px 16px 12px;background:rgba(10,18,12,.78)}
  #scr-game .cut.rival .rv-say.l{left:4%;border-left:4px solid var(--gold)}
  #scr-game .cut.rival .rv-say.r{right:4%;text-align:right;border-right:4px solid var(--gold)}
  #scr-game .cut.rival.short .rv-say{bottom:6%}
  #scr-game .cut.rival .rv-say b{display:block;font:800 12px var(--font-ui);color:var(--gold);letter-spacing:.06em;margin-bottom:3px}
  #scr-game .cut.rival .rv-say span{font:700 19px/1.3 var(--font-ui);color:#fff}
  #scr-game .cut.rival .rv-skill{top:20%;font:400 34px/1.05 var(--font-display);color:var(--gold);max-width:45%;
    -webkit-text-stroke:6px #2a1a00;paint-order:stroke fill;text-shadow:0 5px 0 #2a1a00}
  #scr-game .cut.rival .rv-skill.l{left:4%;transform:skewX(-10deg)}
  #scr-game .cut.rival .rv-skill.r{right:4%;text-align:right;transform:skewX(-10deg)}
  #scr-game .cut.rival .rv-flash{inset:0;background:#fff;animation:rvflash .5s ease-out var(--at) forwards}
  @keyframes rvflash{0%{opacity:.9}100%{opacity:0}}
  #scr-game .cut.rival .rv-numbers{inset:0}
  #scr-game .cut.rival .rv-numbers i{position:absolute;font:700 15px/1 ui-monospace,Consolas,monospace;font-style:normal;color:#9af0ff;
    text-shadow:0 0 8px #3ad0ff;opacity:0;animation:rvnum 1.6s ease-out forwards}
  @keyframes rvnum{0%{opacity:0;transform:translateX(30px)}20%{opacity:.95}100%{opacity:0;transform:translateX(-60px)}}
  #scr-game .cut .band{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    background:linear-gradient(90deg,rgba(10,18,12,0),rgba(10,18,12,.92) 18%,rgba(10,18,12,.92) 82%,rgba(10,18,12,0));
    padding:16px 0;display:flex;align-items:center;gap:20px;justify-content:center;
    animation:band 2.6s ease-out forwards}
  @keyframes band{0%{opacity:0;transform:translateY(-50%) scaleY(.4)}
                  12%{opacity:1;transform:translateY(-50%) scaleY(1)}
                  78%{opacity:1}100%{opacity:0}}
  #scr-game .cut img{height:158px;filter:drop-shadow(0 6px 22px rgba(0,0,0,.75));
    animation:slidein 2.6s cubic-bezier(.15,.8,.25,1) forwards}
  @keyframes slidein{0%{opacity:0;transform:translateX(-46px) scale(.9)}
                     16%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #scr-game .cut .txt{max-width:430px}
  #scr-game .cut .nm{font:400 30px/1.1 var(--font-display);color:var(--gold);
    animation:slidein 2.6s cubic-bezier(.15,.8,.25,1) .08s backwards}
  #scr-game .cut .wh{font-size:12px;color:#cfd8d0;margin-top:3px;font-weight:800}
  #scr-game .cut .ds{font-size:13px;color:#a8b8ac;margin-top:7px;line-height:1.45}

  /* ---- the bottom: a paper panel ---- */
  #scr-game .bottom{flex:none;padding:10px 14px 12px;display:flex;gap:16px;align-items:center;
          background:var(--paper);border-top:3px solid var(--turf);box-shadow:0 -4px 14px rgba(0,0,0,.18)}
  #scr-game .status{width:280px;flex:none}
  #scr-game .status .who{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
  #scr-game .status .who b{font:400 17px/1.15 var(--font-display)}
  #scr-game .bar{height:16px;border-radius:3px;background:var(--paper-3);overflow:hidden;position:relative;
       margin-bottom:5px;box-shadow:inset 0 0 0 1px var(--rule-2),inset 0 2px 0 rgba(0,0,0,.08)}
  #scr-game .bar i{display:block;height:100%;transition:width .12s linear}
  #scr-game .bar em{position:absolute;inset:0;font-style:normal;font:800 11px var(--font-ui);color:#fff;
          display:flex;align-items:center;justify-content:space-between;padding:0 7px;
          text-shadow:0 1px 0 rgba(0,0,0,.55),0 0 3px rgba(0,0,0,.5)}
  #spBar{background:var(--gold)}
  #scr-game #posTxt{font-weight:700}
  #scr-game #posTxt b{font:800 italic 16px var(--font-num)}
  /* The Callout is the player's only in-race lever, so the UI has to answer two
     questions on its own: what does it do, and is now the moment. The button carries
     the first; the urgent state and the hint line carry the second. */
  #scr-game .callout{flex:none;text-align:center;width:170px}
  #scr-game .callout button{width:100%;padding:10px 10px 9px;display:flex;flex-direction:column;
    gap:2px;align-items:center;line-height:1.15;transition:filter .12s,transform .08s;
    background:var(--red);color:#fff;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 0 var(--red-lo)}
  #scr-game .callout button:hover:not(:disabled){background:#e23a47}
  /* spent or nothing left to draw: a flat grey key, not a faded red one */
  #scr-game .callout button:disabled{opacity:1;background:var(--paper-3);color:var(--ink-3);
    box-shadow:inset 0 0 0 1px var(--rule-2)}
  #scr-game .callout button:disabled .cokey{background:rgba(0,0,0,.08)}
  #scr-game .callout button:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--red-lo)}
  #scr-game .colabel{font:400 16px/1 var(--font-display);display:flex;align-items:center;gap:6px}
  #scr-game .colabel .ico{width:20px;height:20px}
  #scr-game .cokey{background:rgba(0,0,0,.25);border-radius:3px;font:800 10px/1 var(--font-ui);padding:2px 4px;color:inherit}
  #scr-game .cosub{font-size:10.5px;opacity:.9;font-weight:700}
  #scr-game .copips{display:flex;gap:4px;justify-content:center;margin-top:7px}
  #scr-game .copips i{width:18px;height:6px;border-radius:2px;background:var(--red)}
  #scr-game .copips i.used{background:var(--paper-3);box-shadow:inset 0 0 0 1px var(--rule-2)}
  #scr-game .cohint{font-size:11px;margin-top:4px;min-height:26px;line-height:1.25;color:var(--ink-3);font-weight:700}
  /* urgent: the hand cannot be played and a Callout is sitting unused */
  #scr-game .callout.urgent button:not(:disabled){animation:pulse 1.05s ease-out infinite}
  #scr-game .callout.urgent .cohint{color:var(--red)}
  #scr-game .callout.warm button:not(:disabled){animation:pulse 2.6s ease-out infinite}
  #scr-game .callout.spent .cohint{color:var(--ink-3)}
  @keyframes pulse{0%{outline:0 solid rgba(242,183,5,.8)}70%{outline:8px solid rgba(242,183,5,0)}100%{outline:0 solid rgba(242,183,5,0)}}
  #scr-game .played.stuck{outline:2px solid var(--gold);outline-offset:3px;border-radius:var(--r)}
  /* The tip sits in .stage, which is short once the HUD bars take their share. Anchored
     to the bottom with no ceiling it grew upward straight over the top bar, so it is
     bounded by its container on both axes and scrolls if it still does not fit.
     Centred with left/right + auto margins rather than left:50% + translate: a
     shrink-to-fit absolute box measures its available width from the offset, so at
     left:50% it could never be wider than half the stage. */
  #scr-game .firsttip{position:absolute;left:12px;right:12px;bottom:18px;margin:0 auto;
    max-width:520px;max-height:calc(100% - 36px);display:flex;flex-direction:column;
    background:var(--paper);border:1px solid var(--rule-2);border-top:4px solid var(--gold);border-radius:var(--r-lg);
    padding:13px 16px;font-size:13.5px;line-height:1.55;z-index:8;color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #scr-game .firsttip b{color:var(--gold-lo)}
  /* Only the prose scrolls. The dismiss button stays put -- on a short stage it was the
     part that fell below the fold, which is the one thing that must never happen to it. */
  #scr-game .ft-text{overflow-y:auto;min-height:0}
  #scr-game .firsttip button{margin-top:10px;align-self:flex-start;background:var(--gold);color:#3a2800;
    font-weight:800;padding:7px 16px;box-shadow:0 3px 0 var(--gold-lo)}
  #scr-game .played{flex:1;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;min-width:0;
          align-content:flex-start;max-height:84px;overflow-y:auto}
  /* The two HUD bars are fixed-width flex rows tuned for a wide window. Below this they
     stop fitting: the Stable button walked entirely off the right edge and the Callout --
     the one control the whole game is about -- was clipped. Let them wrap and let the
     fixed-width blocks become full-width rows instead. */
  @media (max-width:660px){
    #scr-game .top{flex-wrap:wrap;gap:8px 10px;padding:8px 10px}
    #scr-game .top h1{font-size:13px}
    #scr-game .top .spacer{flex:1 0 0}
    #scr-game .bottom{flex-wrap:wrap;gap:10px;padding:8px 10px 10px}
    #scr-game .status{width:auto;flex:1 1 100%;min-width:0}
    #scr-game .callout{width:auto;flex:1 1 100%}
    #scr-game .callout button{flex-direction:row;justify-content:center;gap:8px;padding:8px 10px}
    #scr-game .played{flex:1 1 100%;max-height:62px}
    #rankBig{font-size:44px}
  }
  #scr-game .bottom .chip{display:flex;align-items:center;gap:7px;background:var(--paper-2);border:0;
        border-radius:var(--r);padding:4px 10px 4px 4px;font-size:12.5px;font-weight:800;
        box-shadow:inset 0 0 0 1px var(--rule),0 2px 0 var(--rule-2)}
  #scr-game .bottom .chip.dead{opacity:.5;box-shadow:inset 0 0 0 1px var(--rule)}
  #scr-game .bottom .chip small{color:var(--ink-3);font-size:11px;font-weight:700}
  #scr-game .bottom .chip img{width:26px;height:26px;object-fit:cover;object-position:top;border-radius:var(--r-sm)}
  #scr-game .bottom .chip.spent{opacity:.42}
  #scr-game .bottom .chip.ready{box-shadow:inset 0 0 0 2px var(--turf),0 2px 0 var(--turf-lo)}
  #scr-game .bottom .chip b{font-weight:800}

  /* ---- the sheet: deck, exhibition setup, results ---- */
  /* hidden until a screen asks for it -- the shell owns what is on screen at boot */
  .modal{position:fixed;inset:0;background:rgba(10,22,12,.82);display:none;align-items:center;
         justify-content:center;z-index:20;padding:18px;overflow:auto}
  .modal.open{display:flex}
  #modal .sheet{background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r-lg);padding:0 0 6px;
         max-width:1080px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  #modal .sheet>h2:first-child{margin:0;padding:13px 22px 12px;
    background:repeating-linear-gradient(90deg,#2d8a3c 0 28px,#33933f 28px 56px);color:#fff;
    font:400 17px/1.2 var(--font-display);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:2}
  #modal .sheet>*:not(h2:first-child){margin-left:22px;margin-right:22px}
  /* a table sizes its border box to 100%, so the gutters have to come out of it */
  #modal .sheet>table{width:calc(100% - 44px)}
  /* top and bottom only: a margin shorthand here would zero the sheet's side gutter */
  #modal .sheet h2{margin-top:16px;margin-bottom:4px;font:400 18px var(--font-display);color:var(--ink)}
  #modal .sheet h3{margin-top:20px;margin-bottom:8px;font:400 14px var(--font-display);color:var(--ink);
    display:flex;align-items:center;gap:8px}
  #modal .sheet h3::after{content:"";flex:1;height:2px;background:var(--rule)}
  #modal .sheet h3 .meta{font:700 12.5px/1.3 var(--font-ui);color:var(--ink-3)}
  #modal .sheet h3 .meta b{font-weight:800;color:var(--ink)}

  @media (max-width:900px){ #scr-game .status{width:200px} #scr-game .top{gap:9px;padding:8px 10px} }
  /* A phone cannot hold eight columns: the cards column wrapped every row three lines
     tall and the sheet scrolled sideways. The board keeps what a result is read for --

  @media (max-width:600px){
